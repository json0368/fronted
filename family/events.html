<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照护事件 - 守心智护 家庭端</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="../styles/common.css" rel="stylesheet">
    <style>
        /* ===== CSS Variables ===== */
        :root {
            --color-bg: #FAFAF8;
            --color-white: #FFFFFF;
            --color-primary: #2A9D8F;
            --color-primary-light: #E8F5F3;
            --color-primary-bg: #E8F5F3;
            --color-primary-dark: #1F7A6E;
            --color-text: #2D3436;
            --color-text-secondary: #636E72;
            --color-text-light: #B2BEC3;
            --color-border: #E8E8E4;
            --color-border-light: #F0F0EC;
            --color-risk-green: #27AE60;
            --color-risk-yellow: #F2C94C;
            --color-risk-orange: #E76F51;
            --color-risk-red: #E63946;
            --color-risk-green-bg: #EAFAF1;
            --color-risk-yellow-bg: #FEF9E7;
            --color-risk-orange-bg: #FDEDEC;
            --color-risk-red-bg: #FDEDEC;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --sidebar-width: 240px;
            --header-height: 0px;
        }

        /* ===== Reset ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ===== Layout ===== */
        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar is unified in common.css */

        /* ===== Main Content ===== */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 32px 40px;
            max-width: 100%;
            overflow-x: hidden;
        }

        /* ===== Page Header ===== */
        .page-header {
            margin-bottom: 32px;
        }

        .page-header-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .page-title {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--color-text);
        }

        .page-meta {
            display: flex;
            gap: 24px;
            font-size: 0.85rem;
            color: var(--color-text-secondary);
        }

        .page-meta .meta-label {
            color: var(--color-text-light);
        }

        .page-meta .meta-value {
            font-weight: 500;
        }

        /* ===== Section Title ===== */
        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: var(--color-primary);
            border-radius: 2px;
        }

        /* ===== Card ===== */
        .card {
            background-color: var(--color-white);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--color-border-light);
            transition: box-shadow 0.25s ease, transform 0.25s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .card-body {
            padding: 24px;
        }

        /* ===== Filter Tabs ===== */
        .filter-tabs {
            display: flex;
            gap: 8px;
        }

        .filter-tab {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid var(--color-border);
            background: var(--color-white);
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-tab:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        .filter-tab.active {
            background-color: var(--color-primary);
            color: var(--color-white);
            border-color: var(--color-primary);
        }

        /* ===== Alert Table ===== */
        .alert-table {
            width: 100%;
            border-collapse: collapse;
        }

        .alert-table thead th {
            text-align: left;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--color-text-light);
            padding: 12px 16px;
            border-bottom: 1px solid var(--color-border-light);
            letter-spacing: 0.5px;
        }

        .alert-table tbody td {
            padding: 14px 16px;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--color-border-light);
            vertical-align: middle;
        }

        .alert-table tbody tr {
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .alert-table tbody tr:last-child td {
            border-bottom: none;
        }

        .alert-table tbody tr:hover {
            background-color: rgba(42, 157, 143, 0.03);
        }

        .alert-table tbody tr.expanded {
            background-color: rgba(42, 157, 143, 0.04);
        }

        .alert-time {
            font-variant-numeric: tabular-nums;
            color: var(--color-text-secondary);
            white-space: nowrap;
        }

        .alert-type {
            font-weight: 500;
        }

        .alert-subject {
            color: var(--color-text-secondary);
        }

        /* Risk badge */
        .risk-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            gap: 6px;
        }

        .risk-badge.green {
            background-color: var(--color-risk-green-bg);
            color: var(--color-risk-green);
        }

        .risk-badge.yellow {
            background-color: var(--color-risk-yellow-bg);
            color: #B7950B;
        }

        .risk-badge.orange {
            background-color: var(--color-risk-orange-bg);
            color: var(--color-risk-orange);
        }

        .risk-badge.red {
            background-color: var(--color-risk-red-bg);
            color: var(--color-risk-red);
        }

        .risk-badge .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
        }

        /* Alert Status */
        .alert-status {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .alert-status.processed {
            background-color: var(--color-primary-light);
            color: var(--color-primary);
        }

        .alert-status.recorded {
            background-color: var(--color-primary-light);
            color: var(--color-primary);
        }

        .alert-status.intervened {
            background-color: var(--color-risk-orange-bg);
            color: var(--color-risk-orange);
        }

        .alert-status.resolved {
            background-color: var(--color-risk-green-bg);
            color: var(--color-risk-green);
        }

        /* ===== Expand Row Detail ===== */
        .event-detail-row td {
            padding: 0 !important;
            border-bottom: 1px solid var(--color-border-light) !important;
        }

        .event-detail-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            background-color: rgba(42, 157, 143, 0.02);
        }

        .event-detail-content.open {
            max-height: 300px;
            padding: 16px 24px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-label {
            font-size: 0.75rem;
            color: var(--color-text-light);
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 0.85rem;
            color: var(--color-text);
            font-weight: 500;
        }

        .expand-icon {
            display: inline-flex;
            width: 20px;
            height: 20px;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
            color: var(--color-text-light);
        }

        .expand-icon svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        tr.expanded .expand-icon {
            transform: rotate(90deg);
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .main-content {
                margin-left: 0;
                padding: 20px 16px;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            .page-header-top {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Page Header -->

            <!-- Event Table -->
            <div class="card">

    <script>
        // ===== Mock Data =====
        var events = [

            },

                    handler: '张秀兰',
                    action: '引导回卧室，开启夜间灯光，检查门窗安全锁。'
                }
            },
            {
                time: '05-29 16:45',
                type: '照护者情绪危机',
                level: 'high',
                levelText: '高危',
                subject: '张秀兰',
                status: 'intervened',
                statusText: '已介入',
                detail: {
                    description: '照护者张秀兰因长期照护压力出现情绪崩溃，哭泣并表示无法继续。',
                    location: '客厅',
                    duration: '30分钟',
                    handler: '李明（远程）',

                }
            },
            {

                type: '拒食',
                level: 'low',
                levelText: '低',
                subject: '李建国',
                status: 'resolved',
                statusText: '已缓解',
                detail: {

                    location: '餐厅',
                    duration: '10分钟',
                    handler: '张秀兰',
                    action: '更换食物种类后少量进食，记录饮食日志供医生参考。'
                }
            },
            {
                time: '05-28 22:10',
                type: '夜间游走',
                level: 'medium',
                levelText: '中等',
                subject: '李建国',
                status: 'recorded',
                statusText: '已记录',
                detail: {
                    description: '夜间22:10患者在卧室与卫生间之间反复走动，表现出不安情绪。',
                    location: '卧室/卫生间',
                    duration: '25分钟',
                    handler: '张秀兰',
                    action: '陪伴安抚直至入睡，记录游走频次。'
                }
            },
            {
                time: '05-28 15:30',
                type: '幻觉妄想',
                level: 'high',
                levelText: '高',
                subject: '李建国',
                status: 'processed',
                statusText: '已处理',
                detail: {
                    description: '患者坚称房间内有陌生人，表现出恐惧和攻击性，拒绝他人靠近。',
                    location: '卧室',
                    duration: '20分钟',
                    handler: '张秀兰',
                    action: '保持安全距离，轻声安抚，转移注意力后症状缓解。已通知主治医生。'
                }
            },
            {
                time: '05-27 09:00',
                type: '拒药',
                level: 'medium',
                levelText: '中等',
                subject: '李建国',
                status: 'processed',
                statusText: '已处理',
                detail: {
                    description: '上午服药时间患者拒绝服用多奈哌齐，将药片藏于舌下后吐出。',
                    location: '餐厅',
                    duration: '10分钟',
                    handler: '张秀兰',
                    action: '更换给药方式，将药物混入食物中服用，记录异常行为。'
                }
            },
            {
                time: '05-26 19:30',
                type: '拒食',
                level: 'low',
                levelText: '低',
                subject: '李建国',
                status: 'resolved',
                statusText: '已缓解',
                detail: {
                    description: '晚餐时患者仅吃少量食物后推开餐盘，情绪低落。',
                    location: '餐厅',
                    duration: '5分钟',
                    handler: '张秀兰',
                    action: '准备患者喜欢的小食作为补充，记录饮食摄入量。'
                }
            }
        ];

        var expandedRows = {};

        // ===== Render Functions =====

        function getLevelBadgeClass(level) {
            switch (level) {
                case 'high': return 'red';
                case 'medium': return 'yellow';
                case 'low': return 'green';
                default: return 'yellow';
            }
        }

        function getStatusClass(status) {
            switch (status) {
                case 'processed': return 'processed';
                case 'recorded': return 'recorded';
                case 'intervened': return 'intervened';
                case 'resolved': return 'resolved';
                default: return 'recorded';
            }
        }

        function filterEvents(filter, btn) {
            // Update active tab
            var tabs = document.querySelectorAll('.filter-tab');
            tabs.forEach(function(tab) { tab.classList.remove('active'); });
            btn.classList.add('active');

            // Filter and re-render
            renderTable(filter);
        }

        function toggleRow(index) {
            var detailRow = document.getElementById('detail-' + index);
            var mainRow = document.getElementById('row-' + index);
            var content = detailRow.querySelector('.event-detail-content');

            if (expandedRows[index]) {
                content.classList.remove('open');
                mainRow.classList.remove('expanded');
                expandedRows[index] = false;
            } else {
                content.classList.add('open');
                mainRow.classList.add('expanded');
                expandedRows[index] = true;
            }
        }

        function renderTable(filter) {
            var tbody = document.getElementById('eventTableBody');
            tbody.innerHTML = '';
            expandedRows = {};

            var filtered = events;
            if (filter && filter !== 'all') {
                filtered = events.filter(function(e) {
                    if (filter === 'high') return e.level === 'high';
                    if (filter === 'medium') return e.level === 'medium';
                    if (filter === 'low') return e.level === 'low';
                    return true;
                });
            }

            filtered.forEach(function(event, index) {
                // Main row
                var tr = document.createElement('tr');
                tr.id = 'row-' + index;
                tr.onclick = function() { toggleRow(index); };

                var tdExpand = document.createElement('td');
                tdExpand.innerHTML = '<span class="expand-icon"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>';

                var tdTime = document.createElement('td');
                tdTime.className = 'alert-time';
                tdTime.textContent = event.time;

                var tdType = document.createElement('td');
                tdType.className = 'alert-type';
                tdType.textContent = event.type;

                var tdLevel = document.createElement('td');
                var levelBadge = document.createElement('span');
                levelBadge.className = 'risk-badge ' + getLevelBadgeClass(event.level);
                levelBadge.innerHTML = '<span class="badge-dot"></span>' + event.levelText;
                tdLevel.appendChild(levelBadge);

                var tdSubject = document.createElement('td');
                tdSubject.className = 'alert-subject';
                tdSubject.textContent = event.subject;

                var tdStatus = document.createElement('td');
                var statusBadge = document.createElement('span');
                statusBadge.className = 'alert-status ' + getStatusClass(event.status);
                statusBadge.textContent = event.statusText;
                tdStatus.appendChild(statusBadge);

                tr.appendChild(tdExpand);
                tr.appendChild(tdTime);
                tr.appendChild(tdType);
                tr.appendChild(tdLevel);
                tr.appendChild(tdSubject);
                tr.appendChild(tdStatus);
                tbody.appendChild(tr);

                // Detail row
                var detailTr = document.createElement('tr');
                detailTr.className = 'event-detail-row';
                detailTr.id = 'detail-' + index;

                var detailTd = document.createElement('td');
                detailTd.colSpan = 6;

                var detailContent = document.createElement('div');
                detailContent.className = 'event-detail-content';

                var detailGrid = document.createElement('div');
                detailGrid.className = 'detail-grid';

                var detailItems = [
                    { label: '事件描述', value: event.detail.description },
                    { label: '发生地点', value: event.detail.location },
                    { label: '持续时长', value: event.detail.duration },
                    { label: '处理人员', value: event.detail.handler },
                    { label: '处理措施', value: event.detail.action }
                ];

                detailItems.forEach(function(item) {
                    var div = document.createElement('div');
                    div.className = 'detail-item';
                    if (item.label === '事件描述' || item.label === '处理措施') {
                        div.style.gridColumn = 'span 2';
                    }

                    var label = document.createElement('span');
                    label.className = 'detail-label';
                    label.textContent = item.label;

                    var value = document.createElement('span');
                    value.className = 'detail-value';
                    value.textContent = item.value;

                    div.appendChild(label);
                    div.appendChild(value);
                    detailGrid.appendChild(div);
                });

                detailContent.appendChild(detailGrid);
                detailTd.appendChild(detailContent);
                detailTr.appendChild(detailTd);
                tbody.appendChild(detailTr);
            });
        }

        // ===== Initialize =====
        document.addEventListener('DOMContentLoaded', function() {
            renderTable('all');
        });
    </script>
</body>
</html>
