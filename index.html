<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>守心智护 - 产品演示</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #2A9D8F;
      --color-primary-light: #3DB8A9;
      --color-primary-dark: #1F7A6E;
      --color-bg: #FAFAF8;
      --color-surface: #FFFFFF;
      --color-text: #2D2D2D;
      --color-text-secondary: #6B6B6B;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--color-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      max-width: 800px;
      padding: 40px 24px;
    }

    .logo-mark {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
      border-radius: 16px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-mark svg {
      width: 36px;
      height: 36px;
      fill: white;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--color-text-secondary);
      margin-bottom: 48px;
      line-height: 1.6;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .card {
      background: var(--color-surface);
      border-radius: 16px;
      padding: 32px 24px;
      border: 1.5px solid #E8E6E1;
      text-decoration: none;
      color: inherit;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .card:hover {
      border-color: var(--color-primary);
      box-shadow: 0 8px 24px rgba(42,157,143,0.12);
      transform: translateY(-2px);
    }

    .card-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon svg {
      width: 28px;
      height: 28px;
    }

    .card-icon--caregiver {
      background: #E8F5F3;
      color: var(--color-primary);
    }

    .card-icon--family {
      background: #FFF3E0;
      color: #FF9800;
    }

    .card-icon--institution {
      background: #E3F2FD;
      color: #2196F3;
    }

    .card-title {
      font-size: 1.125rem;
      font-weight: 600;
    }

    .card-desc {
      font-size: 0.8125rem;
      color: var(--color-text-secondary);
      line-height: 1.5;
    }

    .footer {
      margin-top: 48px;
      font-size: 0.75rem;
      color: #9B9B9B;
    }

    @media (max-width: 640px) {
      .cards { grid-template-columns: 1fr; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    </div>
    <h1>守心智护</h1>
    <p class="subtitle">面向阿尔茨海默病家庭照护场景的智能 Agent 系统<br>产品界面演示</p>

    <div class="cards">
      <a href="caregiver/index.html" class="card">
        <div class="card-icon card-icon--caregiver">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <div class="card-title">照护者端</div>
        <div class="card-desc">智能对话、风险识别、<br>主动关怀、知识问答</div>
      </a>

      <a href="family/index.html" class="card">
        <div class="card-icon card-icon--family">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        </div>
        <div class="card-title">家庭端</div>
        <div class="card-desc">风险看板、趋势追踪、<br>周报反馈、紧急通知</div>
      </a>

      <a href="institution/index.html" class="card">
        <div class="card-icon card-icon--institution">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-1.99.9-1.99 2L3 19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/></svg>
        </div>
        <div class="card-title">机构端</div>
        <div class="card-desc">风险总览、预警处理、<br>排班管理、数据报表</div>
      </a>
    </div>

    <div class="footer">守心智护 &copy; 2026 演示系统</div>
  </div>
</body>
</html>
