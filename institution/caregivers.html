<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>护工管理 - 守心智护 机构端</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/common.css">
<style>
  :root {
    --color-primary: #2196F3;
    --color-primary-light: #64B5F6;
    --color-primary-dark: #1976D2;
    --color-primary-bg: #E3F2FD;
  }

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: #FAFAF8;
    color: #333;
    display: flex;
    min-height: 100vh;
  }

  /* Sidebar is unified in common.css */

  /* ===== Main Content ===== */
  .main {
    margin-left: 240px;
    flex: 1;
    padding: 32px 36px;
    min-height: 100vh;
  }

  .page-header {
    margin-bottom: 28px;
  }

  .page-header .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .page-header h1 {
    font-size: 24px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 8px;
  }

  .header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn {
    padding: 8px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 500;
    transition: all 0.2s ease;
  }

  .btn-primary {
    background: #2196F3;
    color: #fff;
  }

  .btn-primary:hover {
    background: #1976D2;
    box-shadow: 0 2px 8px rgba(33,150,243,0.3);
  }

  .btn-outline {
    background: #fff;
    color: #666;
    border: 1px solid #ddd;
  }

  .btn-outline:hover {
    border-color: #2196F3;
    color: #2196F3;
  }

  /* Search Input */
  .search-input {
    padding: 8px 14px;
    border: 1px solid #E0E0E0;
    border-radius: 8px;
    font-size: 13px;
    font-family: 'Noto Sans SC', sans-serif;
    width: 220px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .search-input:focus {
    border-color: #2196F3;
  }

  /* Filter Tabs */
  .filter-bar {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    align-items: center;
  }

  .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .filter-group .filter-label {
    font-size: 13px;
    color: #888;
    white-space: nowrap;
  }

  .filter-tabs {
    display: flex;
    gap: 4px;
  }

  .filter-tab {
    padding: 5px 14px;
    border-radius: 16px;
    border: 1px solid #E0E0E0;
    background: #fff;
    color: #666;
    font-size: 12px;
    font-family: 'Noto Sans SC', sans-serif;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .filter-tab:hover {
    border-color: #2196F3;
    color: #2196F3;
  }

  .filter-tab.active {
    background: #2196F3;
    color: #fff;
    border-color: #2196F3;
  }

  /* Section Card */
  .section-card {
    background: #fff;
    border-radius: 14px;
    padding: 24px 28px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.05);
    border: 1px solid #F0F0EC;
    margin-bottom: 24px;
  }

  /* Table */
  .table-wrap {
    overflow-x: auto;
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
  }

  .data-table thead th {
    text-align: left;
    padding: 12px 14px;
    font-size: 12px;
    font-weight: 500;
    color: #888;
    border-bottom: 1px solid #F0F0EC;
    white-space: nowrap;
  }

  .data-table tbody tr {
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .data-table tbody tr:hover {
    background: #FAFAF8;
  }

  .data-table tbody td {
    padding: 14px 14px;
    font-size: 13px;
    color: #444;
    border-bottom: 1px solid #F8F8F6;
    vertical-align: middle;
  }

  .data-table .name-cell {
    font-weight: 500;
    color: #1a1a1a;
  }

  /* Risk Badge */
  .risk-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }

  .risk-badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .risk-badge.green {
    background: #E8F5E9;
    color: #2E7D32;
  }
  .risk-badge.green .dot { background: #4CAF50; }

  .risk-badge.yellow {
    background: #FFF3E0;
    color: #E65100;
  }
  .risk-badge.yellow .dot { background: #FF9800; }

  .risk-badge.orange {
    background: #FBE9E7;
    color: #BF360C;
  }
  .risk-badge.orange .dot { background: #FF5722; }

  .risk-badge.red {
    background: #FFEBEE;
    color: #C62828;
  }
  .risk-badge.red .dot { background: #F44336; }

  .score-cell {
    font-weight: 600;
    font-size: 14px;
  }

  .score-cell.high { color: #F44336; }
  .score-cell.mid { color: #FF5722; }
  .score-cell.low { color: #FF9800; }
  .score-cell.safe { color: #4CAF50; }

  .btn-view {
    padding: 5px 14px;
    border-radius: 6px;
    border: 1px solid #E0E0E0;
    background: #fff;
    color: #2196F3;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    transition: all 0.15s ease;
    margin-right: 4px;
  }

  .btn-view:hover {
    background: #E3F2FD;
    border-color: #2196F3;
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.show {
    display: flex;
  }

  .modal-box {
    background: #fff;
    border-radius: 16px;
    width: 560px;
    max-width: 90vw;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    overflow: hidden;
    animation: modalIn 0.25s ease;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid #F0F0EC;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-header h3 {
    font-size: 17px;
    font-weight: 600;
    color: #1a1a1a;
  }

  .modal-close {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: none;
    background: #F5F5F5;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }

  .modal-close:hover {
    background: #EEEEEE;
  }

  .modal-close svg {
    width: 16px;
    height: 16px;
    stroke: #888;
    stroke-width: 2;
    fill: none;
  }

  .modal-body {
    padding: 24px;
    max-height: 60vh;
    overflow-y: auto;
  }

  .detail-section {
    margin-bottom: 20px;
  }

  .detail-section-title {
    font-size: 14px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #F5F5F3;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .detail-item .dl {
    font-size: 12px;
    color: #999;
    margin-bottom: 4px;
  }

  .detail-item .dv {
    font-size: 14px;
    color: #333;
    font-weight: 500;
  }

  /* Bar Chart */
  .bar-chart {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    height: 100px;
    padding-top: 10px;
  }

  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .bar {
    width: 100%;
    border-radius: 4px 4px 0 0;
    transition: height 0.5s ease;
    min-width: 20px;
  }

  .bar-label {
    font-size: 10px;
    color: #999;
  }

  .bar-value {
    font-size: 10px;
    color: #666;
    font-weight: 500;
  }

  /* Elder list */
  .elder-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .elder-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: #FAFAF8;
    border-radius: 6px;
    font-size: 13px;
    color: #444;
  }

  .elder-item .elder-tag {
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 4px;
    background: #E3F2FD;
    color: #1565C0;
  }

  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid #F0F0EC;
    text-align: right;
  }

  .modal-footer .btn {
    min-width: 80px;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main { margin-left: 0; padding: 20px 16px; }
    .filter-bar { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

  <nav class="sidebar-nav">

  <div class="sidebar-footer">

</aside>

<!-- Main Content -->
<main class="main">
  <div class="page-header">
    <div class="header-top">
      <div>
        <h1>护工管理</h1>
      </div>
      <div class="header-actions">
        <input type="text" class="search-input" placeholder="搜索护工姓名..." id="searchInput">
        <button class="btn btn-primary" onclick="alert('添加护工功能')">+ 添加护工</button>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">按区域：</span>
      <div class="filter-tabs" id="areaFilter">
        <button class="filter-tab active" data-area="all">全部</button>
        <button class="filter-tab" data-area="A区">A区</button>
        <button class="filter-tab" data-area="B区">B区</button>
        <button class="filter-tab" data-area="C区">C区</button>
      </div>
    </div>
    <div class="filter-group">
      <span class="filter-label">按班次：</span>
      <div class="filter-tabs" id="shiftFilter">
        <button class="filter-tab active" data-shift="all">全部</button>
        <button class="filter-tab" data-shift="白班">白班</button>
        <button class="filter-tab" data-shift="夜班">夜班</button>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="section-card">
    <div class="table-wrap">
      <table class="data-table" id="caregiverTable">
        <thead>
          <tr>
            <th>姓名</th>
            <th>区域</th>
            <th>负责老人数</th>
            <th>班次</th>
            <th>入职时间</th>
            <th>风险等级</th>
            <th>风险分数</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle">护工详情</h3>
      <button class="modal-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<script>
  const caregivers = [
    { name: '张秀兰', area: 'A区', elders: 3, shift: '白班', joinDate: '2023-05-15', riskLevel: '黄色', score: 62, age: 45, gender: '女', phone: '138****5678', elderList: ['李大爷 (A101)', '王奶奶 (A102)', '赵爷爷 (A105)'], trend: [48, 50, 53, 55, 58, 60, 62] },
    { name: '刘桂花', area: 'B区', elders: 4, shift: '白班', joinDate: '2022-08-20', riskLevel: '橙色', score: 78, age: 45, gender: '女', phone: '138****5678', elderList: ['张奶奶 (B201)', '刘大爷 (B203)', '陈奶奶 (B205)', '周爷爷 (B208)'], trend: [60, 63, 66, 69, 72, 75, 78] },
    { name: '王淑芬', area: 'A区', elders: 2, shift: '夜班', joinDate: '2024-01-10', riskLevel: '绿色', score: 35, age: 45, gender: '女', phone: '138****5678', elderList: ['孙奶奶 (A108)', '吴爷爷 (A110)'], trend: [38, 36, 35, 34, 36, 35, 35] },
    { name: '陈美玲', area: 'C区', elders: 5, shift: '白班', joinDate: '2021-03-08', riskLevel: '红色', score: 89, age: 45, gender: '女', phone: '138****5678', elderList: ['马大爷 (C301)', '黄奶奶 (C302)', '林爷爷 (C304)', '何奶奶 (C306)', '郑大爷 (C308)'], trend: [70, 74, 78, 80, 83, 86, 89] },
    { name: '赵玉华', area: 'B区', elders: 3, shift: '夜班', joinDate: '2023-11-22', riskLevel: '绿色', score: 28, age: 45, gender: '女', phone: '138****5678', elderList: ['高奶奶 (B210)', '梁爷爷 (B212)', '宋奶奶 (B215)'], trend: [30, 29, 28, 30, 29, 28, 28] },
    { name: '孙丽萍', area: 'A区', elders: 4, shift: '白班', joinDate: '2022-06-30', riskLevel: '黄色', score: 55, age: 45, gender: '女', phone: '138****5678', elderList: ['唐大爷 (A112)', '韩奶奶 (A114)', '冯爷爷 (A116)', '董奶奶 (A118)'], trend: [45, 47, 49, 50, 52, 54, 55] }
  ];

  const riskColorMap = { '绿色': 'green', '黄色': 'yellow', '橙色': 'orange', '红色': 'red' };
  const riskLabelMap = { '绿色': '常态', '黄色': '压力上升', '橙色': '临界高压', '红色': '急性高危' };

  function getScoreClass(score) {
    if (score >= 80) return 'high';
    if (score >= 60) return 'mid';
    if (score >= 40) return 'low';
    return 'safe';
  }

  let currentArea = 'all';
  let currentShift = 'all';
  let searchQuery = '';

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    let filtered = caregivers.filter(c => {
      if (currentArea !== 'all' && c.area !== currentArea) return false;
      if (currentShift !== 'all' && c.shift !== currentShift) return false;
      if (searchQuery && !c.name.includes(searchQuery)) return false;
      return true;
    });

    tbody.innerHTML = filtered.map((c, i) => {
      const idx = caregivers.indexOf(c);
      const color = riskColorMap[c.riskLevel];
      return `
        <tr data-index="${idx}">
          <td class="name-cell">${c.name}</td>
          <td>${c.area}</td>
          <td>${c.elders}人</td>
          <td>${c.shift}</td>
          <td>${c.joinDate}</td>
          <td>
            <span class="risk-badge ${color}">
              <span class="dot"></span>
              ${c.riskLevel}
            </span>
          </td>
          <td class="score-cell ${getScoreClass(c.score)}">${c.score}分</td>
          <td>
            <button class="btn-view" onclick="event.stopPropagation(); showDetail(${idx})">详情</button>
            <button class="btn-view" onclick="event.stopPropagation(); alert('排班管理功能')">排班</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  function showDetail(index) {
    const c = caregivers[index];
    const color = riskColorMap[c.riskLevel];
    document.getElementById('modalTitle').textContent = c.name + ' - 详细档案';

    const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
    const maxScore = Math.max(...c.trend);

    document.getElementById('modalBody').innerHTML = `
      <div class="detail-section">
        <div class="detail-section-title">基本信息</div>
        <div class="detail-grid">
          <div class="detail-item">
            <div class="dl">姓名</div>
            <div class="dv">${c.name}</div>
          </div>
          <div class="detail-item">
            <div class="dl">年龄</div>
            <div class="dv">${c.age}岁</div>
          </div>
          <div class="detail-item">
            <div class="dl">性别</div>
            <div class="dv">${c.gender}</div>
          </div>
          <div class="detail-item">
            <div class="dl">联系电话</div>
            <div class="dv">${c.phone}</div>
          </div>
          <div class="detail-item">
            <div class="dl">入职时间</div>
            <div class="dv">${c.joinDate}</div>
          </div>
          <div class="detail-item">
            <div class="dl">所属区域</div>
            <div class="dv">${c.area}</div>
          </div>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">当前风险状态</div>
        <div class="detail-grid">
          <div class="detail-item">
            <div class="dl">风险等级</div>
            <div class="dv"><span class="risk-badge ${color}"><span class="dot"></span>${c.riskLevel}（${riskLabelMap[c.riskLevel]}）</span></div>
          </div>
          <div class="detail-item">
            <div class="dl">风险分数</div>
            <div class="dv score-cell ${getScoreClass(c.score)}">${c.score}分</div>
          </div>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">近期照护情况</div>
        <div class="elder-list">
          ${c.elderList.map(e => {
            const parts = e.match(/(.+?)\s*\((.+?)\)/);
            return `<div class="elder-item"><span>${parts[1]}</span><span class="elder-tag">${parts[2]}</span></div>`;
          }).join('')}
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">风险趋势图（近7天）</div>
        <div class="bar-chart">
          ${c.trend.map((v, i) => {
            let barColor = '#4CAF50';
            if (v >= 80) barColor = '#F44336';
            else if (v >= 60) barColor = '#FF5722';
            else if (v >= 40) barColor = '#FF9800';
            return `
              <div class="bar-col">
                <div class="bar-value">${v}</div>
                <div class="bar" style="height:${(v / 100) * 80}px;background:${barColor}"></div>
                <div class="bar-label">${days[i]}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
    document.getElementById('detailModal').classList.add('show');
  }

  function closeModal() {
    document.getElementById('detailModal').classList.remove('show');
  }

  document.getElementById('detailModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // Area filter
  document.getElementById('areaFilter').addEventListener('click', function(e) {
    const tab = e.target.closest('.filter-tab');
    if (!tab) return;
    this.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentArea = tab.dataset.area;
    renderTable();
  });

  // Shift filter
  document.getElementById('shiftFilter').addEventListener('click', function(e) {
    const tab = e.target.closest('.filter-tab');
    if (!tab) return;
    this.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentShift = tab.dataset.shift;
    renderTable();
  });

  // Search
  document.getElementById('searchInput').addEventListener('input', function() {
    searchQuery = this.value.trim();
    renderTable();
  });

  // Init
  renderTable();
</script>

</body>
</html>
