<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>培训管理 - 守心智护 机构端</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/common.css">
<style>
  :root {
    --color-primary: #2196F3;
    --color-primary-light: #64B5F6;
    --color-primary-dark: #1976D2;
    --color-primary-bg: #E3F2FD;
  }

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: #FAFAF8;
    color: #333;
    display: flex;
    min-height: 100vh;
  }

  /* Sidebar is unified in common.css */

  /* ===== Main Content ===== */
  .main {
    margin-left: 240px;
    flex: 1;
    padding: 32px 36px;
    min-height: 100vh;
  }

  .page-header {
    margin-bottom: 28px;
  }

  .page-header .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .page-header h1 {
    font-size: 24px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 8px;
  }

  .header-actions {
    display: flex;
    gap: 10px;
  }

  .btn {
    padding: 8px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 500;
    transition: all 0.2s ease;
  }

  .btn-primary {
    background: #2196F3;
    color: #fff;
  }

  .btn-primary:hover {
    background: #1976D2;
    box-shadow: 0 2px 8px rgba(33,150,243,0.3);
  }

  .btn-outline {
    background: #fff;
    color: #666;
    border: 1px solid #ddd;
  }

  .btn-outline:hover {
    border-color: #2196F3;
    color: #2196F3;
  }

  /* Filter Tabs */
  .filter-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
  }

  .filter-tab {
    padding: 7px 20px;
    border-radius: 20px;
    border: 1px solid #E0E0E0;
    background: #fff;
    color: #666;
    font-size: 13px;
    font-family: 'Noto Sans SC', sans-serif;
    cursor: pointer;
    transition: all 0.2s ease;
    font-weight: 500;
  }

  .filter-tab:hover {
    border-color: #2196F3;
    color: #2196F3;
  }

  .filter-tab.active {
    background: #2196F3;
    color: #fff;
    border-color: #2196F3;
  }

  /* Section Card */
  .section-card {
    background: #fff;
    border-radius: 14px;
    padding: 24px 28px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.05);
    border: 1px solid #F0F0EC;
    margin-bottom: 24px;
  }

  .section-card .section-title {
    font-size: 17px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid #F5F5F3;
  }

  /* Course Cards Grid */
  .course-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }

  .course-card {
    background: #fff;
    border: 1px solid #F0F0EC;
    border-radius: 12px;
    padding: 20px;
    transition: box-shadow 0.2s ease;
    cursor: pointer;
  }

  .course-card:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }

  .course-card .course-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .course-card .course-title {
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
    line-height: 1.4;
    flex: 1;
  }

  .course-card .course-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-left: 12px;
  }

  .course-card .course-icon.ad {
    background: #E3F2FD;
  }

  .course-card .course-icon.mental {
    background: #F3E5F5;
  }

  .course-card .course-icon svg {
    width: 20px;
    height: 20px;
    stroke-width: 1.8;
    fill: none;
  }

  .course-card .course-icon.ad svg {
    stroke: #2196F3;
  }

  .course-card .course-icon.mental svg {
    stroke: #9C27B0;
  }

  .course-tags {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }

  .course-tag {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
  }

  .course-tag.category-ad {
    background: #E3F2FD;
    color: #1565C0;
  }

  .course-tag.category-mental {
    background: #F3E5F5;
    color: #7B1FA2;
  }

  .course-tag.type {
    background: #F5F5F5;
    color: #666;
  }

  .course-progress {
    margin-bottom: 10px;
  }

  .progress-bar {
    height: 6px;
    background: #F0F0EC;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 6px;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
  }

  .progress-bar-fill.complete { background: #4CAF50; }
  .progress-bar-fill.high { background: #2196F3; }
  .progress-bar-fill.mid { background: #FF9800; }
  .progress-bar-fill.low { background: #F44336; }

  .course-stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .course-stats .stat-pct {
    font-size: 18px;
    font-weight: 700;
    color: #1a1a1a;
  }

  .course-stats .stat-pct.complete { color: #4CAF50; }

  .course-stats .stat-detail {
    font-size: 12px;
    color: #999;
  }

  /* Stats Grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }

  .stat-card {
    background: #fff;
    border-radius: 14px;
    padding: 22px 24px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.05);
    border: 1px solid #F0F0EC;
    transition: box-shadow 0.2s ease;
  }

  .stat-card:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }

  .stat-card .stat-label {
    font-size: 13px;
    color: #888;
    margin-bottom: 10px;
  }

  .stat-card .stat-value {
    font-size: 26px;
    font-weight: 700;
    color: #1a1a1a;
  }

  .stat-card .stat-sub {
    font-size: 12px;
    color: #aaa;
    margin-top: 6px;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main { margin-left: 0; padding: 20px 16px; }
    .course-grid { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar sidebar--fixed">
  <div class="sidebar-header">
    <a href="../index.html" class="sidebar-logo">
      <div class="sidebar-logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      </div>
      <div class="sidebar-logo-text">
        <span class="logo-title">守心智护</span>
        <span class="logo-subtitle">机构管理端</span>
      </div>
    </a>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-label">管理功能</div>
    <a href="index.html" class="sidebar-link" data-page="risk-overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      风险总览
    </a>
    <a href="alerts.html" class="sidebar-link" data-page="alert-handling">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      预警处理
    </a>
    <a href="caregivers.html" class="sidebar-link" data-page="caregiver-mgmt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      护工管理
    </a>
    <a href="training.html" class="sidebar-link active" data-page="training">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      培训管理
    </a>
    <a href="reports.html" class="sidebar-link" data-page="reports">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      数据报表
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="nav-label" style="padding: 0 0 8px;">管理员信息</div>
    <div class="sidebar-user">
      <div class="sidebar-avatar">王</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name">王主任</div>
        <div class="sidebar-user-role">阳光养老院</div>
      </div>
    </div>
  </div>
</aside>

<!-- Main Content -->
<main class="main">
  <div class="page-header">
    <div class="header-top">
      <div>
        <h1>培训知识库</h1>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="alert('发布新课程功能')">+ 发布新课程</button>
      </div>
    </div>
  </div>

  <!-- Filter Tabs -->
  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab active" data-filter="all">全部</button>
    <button class="filter-tab" data-filter="ad">AD专业知识</button>
    <button class="filter-tab" data-filter="mental">心理健康</button>
  </div>

  <!-- Course Cards -->
  <div class="course-grid" id="courseGrid"></div>

  <!-- Learning Stats -->
  <div style="margin-top: 32px;">
    <div class="section-card">
      <div class="section-title">学习统计</div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">本月完课率</div>
          <div class="stat-value">68%</div>
          <div class="stat-sub">较上月 +5%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">平均学习时长</div>
          <div class="stat-value">2.3<span style="font-size:14px;font-weight:400;color:#888;margin-left:4px">小时</span></div>
          <div class="stat-sub">每人每月</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">最热门课程</div>
          <div class="stat-value" style="font-size:16px;font-weight:600;line-height:1.4;margin-top:4px;">行为精神症状应对指南</div>
          <div class="stat-sub">18人参与学习</div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  const courses = [
    {
      title: '阿尔茨海默病基础知识',
      category: 'ad',
      categoryLabel: 'AD专业知识',
      type: '图文',
      completion: 100,
      completed: 24,
      total: 24
    },
    {
      title: '行为精神症状应对指南',
      category: 'ad',
      categoryLabel: 'AD专业知识',
      type: '视频',
      completion: 75,
      completed: 18,
      total: 24
    },
    {
      title: '照护者情绪管理与减压',
      category: 'mental',
      categoryLabel: '心理健康',
      type: '图文',
      completion: 50,
      completed: 12,
      total: 24
    },
    {
      title: '正念冥想入门课程',
      category: 'mental',
      categoryLabel: '心理健康',
      type: '视频',
      completion: 0,
      completed: 0,
      total: 24
    },
    {
      title: '紧急情况处理流程',
      category: 'ad',
      categoryLabel: 'AD专业知识',
      type: '图文',
      completion: 90,
      completed: 22,
      total: 24
    }
  ];

  const bookIcon = `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`;
  const videoIcon = `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>`;

  function getProgressClass(pct) {
    if (pct >= 100) return 'complete';
    if (pct >= 70) return 'high';
    if (pct >= 40) return 'mid';
    return 'low';
  }

  function renderCourses(filter) {
    const container = document.getElementById('courseGrid');
    const filtered = filter === 'all' ? courses : courses.filter(c => c.category === filter);

    container.innerHTML = filtered.map(c => {
      const categoryClass = c.category === 'ad' ? 'category-ad' : 'category-mental';
      const iconClass = c.category === 'ad' ? 'ad' : 'mental';
      const icon = c.type === '图文' ? bookIcon : videoIcon;
      const progressClass = getProgressClass(c.completion);

      return `
        <div class="course-card" onclick="alert('查看课程: ${c.title}')">
          <div class="course-header">
            <div class="course-title">${c.title}</div>
            <div class="course-icon ${iconClass}">${icon}</div>
          </div>
          <div class="course-tags">
            <span class="course-tag ${categoryClass}">${c.categoryLabel}</span>
            <span class="course-tag type">${c.type}</span>
          </div>
          <div class="course-progress">
            <div class="progress-bar">
              <div class="progress-bar-fill ${progressClass}" style="width: ${c.completion}%"></div>
            </div>
          </div>
          <div class="course-stats">
            <span class="stat-pct ${c.completion >= 100 ? 'complete' : ''}">${c.completion}%</span>
            <span class="stat-detail">${c.completed}/${c.total}人已完成</span>
          </div>
        </div>
      `;
    }).join('');
  }

  // Filter tab clicks
  document.getElementById('filterTabs').addEventListener('click', function(e) {
    const tab = e.target.closest('.filter-tab');
    if (!tab) return;
    this.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderCourses(tab.dataset.filter);
  });

  // Init
  renderCourses('all');
</script>

</body>
</html>
